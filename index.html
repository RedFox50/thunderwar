<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>ThunderWar</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0D10; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0B0D10; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: #0B0D10; color: #fff; transition: opacity .5s; }
    #loader.done { opacity: 0; pointer-events: none; }
    .title { font-size: clamp(40px, 8vw, 88px); font-weight: 900; font-style: italic; letter-spacing: 1px; }
    .sub { color: #FF9A2E; font-weight: 700; font-size: 18px; margin-top: 2px; letter-spacing: 1px; }
    .bar { width: 44vw; height: 10px; background: #22262B; margin-top: 56px; }
    .fill { height: 100%; width: 0; background: #FF9A2E; transition: width .25s; }
    .row { width: 44vw; display: flex; justify-content: space-between; margin-top: 12px; color: #9EA2A8; font-size: 15px; }
    .error { color: #FF6B57; max-width: 80vw; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="title">THUNDERWAR</div>
    <div class="sub">GROUND FORCES &middot; v0.3.1</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="row"><span id="status">Downloading game files...</span><span id="pct">0%</span></div>
    <div class="error" id="error"></div>
  </div>
  <script>
    // Stage 1 of loading: the browser downloads and starts the game files.
    // Unity's loader reports real progress: about 0-90% is the download, the rest is starting the engine.
    // Once the engine runs, the in-game boot screen (same look) takes over for stage 2.
    var buildUrl = ".";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Eddy",
      productName: "ThunderWar",
      productVersion: "0.3.1",
      // render at the page's real size (sharp on any screen), capped so 4K / retina screens don't melt Chromebooks
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill");
    var status = document.querySelector("#status");
    var pct = document.querySelector("#pct");

    function progress(p) {
      // map the whole page-load stage onto the first 40% of the bar; the game fills the rest
      var shown = Math.round(p * 40);
      fill.style.width = shown + "%";
      pct.textContent = shown + "%";
      status.textContent = p < 0.9 ? "Downloading game files..." : "Starting the engine...";
    }

    // F5 (hide interface) and F6 (screenshot) belong to the game: stop the browser from
    // reloading the page or jumping to the address bar
    window.addEventListener("keydown", function (e) { if (e.key === "F5" || e.key === "F6") e.preventDefault(); }, true);

    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, progress).then(function () {
        document.querySelector("#loader").classList.add("done");
        canvas.focus();
      }).catch(function (message) {
        status.textContent = "Couldn't start the game.";
        document.querySelector("#error").textContent = message + " (try Chrome, and make sure WebGL is turned on)";
      });
    };
    script.onerror = function () { status.textContent = "Couldn't download the game. Check your connection and reload."; };
    document.body.appendChild(script);
  </script>
</body>
</html>
